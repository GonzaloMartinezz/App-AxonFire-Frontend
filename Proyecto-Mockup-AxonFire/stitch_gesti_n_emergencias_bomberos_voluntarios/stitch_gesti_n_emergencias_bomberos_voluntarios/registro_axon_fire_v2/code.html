<!DOCTYPE html>

<html class="dark" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Axon Fire - Tactical Registration</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-high": "#282a2d",
                        "surface-container-lowest": "#0c0e11",
                        "tertiary-container": "#00799c",
                        "primary-container": "#d32f2f",
                        "surface-tint": "#ffb3ac",
                        "on-primary-container": "#fff2f0",
                        "on-primary-fixed-variant": "#930010",
                        "on-surface-variant": "#e4beba",
                        "surface": "#111316",
                        "surface-variant": "#333538",
                        "secondary-fixed": "#d6e3ff",
                        "tertiary-fixed": "#bee9ff",
                        "on-tertiary": "#003546",
                        "on-error": "#690005",
                        "on-tertiary-container": "#e9f7ff",
                        "surface-bright": "#37393d",
                        "outline-variant": "#5b403d",
                        "secondary": "#a9c7ff",
                        "primary-fixed": "#ffdad6",
                        "error": "#ffb4ab",
                        "surface-dim": "#111316",
                        "on-primary-fixed": "#410003",
                        "surface-container": "#1e2023",
                        "inverse-surface": "#e2e2e6",
                        "inverse-on-surface": "#2f3034",
                        "primary-fixed-dim": "#ffb3ac",
                        "secondary-container": "#005db7",
                        "secondary-fixed-dim": "#a9c7ff",
                        "on-error-container": "#ffdad6",
                        "surface-container-highest": "#333538",
                        "on-surface": "#e2e2e6",
                        "outline": "#ab8985",
                        "error-container": "#93000a",
                        "on-tertiary-fixed-variant": "#004d65",
                        "on-secondary-fixed": "#001b3d",
                        "inverse-primary": "#ba1a20",
                        "primary": "#ffb3ac",
                        "on-background": "#e2e2e6",
                        "on-secondary-container": "#c6d9ff",
                        "on-secondary-fixed-variant": "#00468c",
                        "tertiary-fixed-dim": "#7bd1f8",
                        "on-primary": "#680008",
                        "on-tertiary-fixed": "#001f2a",
                        "background": "#111316",
                        "on-secondary": "#003063",
                        "surface-container-low": "#1a1c1f",
                        "tertiary": "#7bd1f8"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "fontFamily": {
                        "headline": ["Space Grotesk"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .mesh-gradient {
            background: radial-gradient(at 0% 0%, #d32f2f 0%, transparent 50%),
                        radial-gradient(at 100% 100%, #005db7 0%, transparent 50%),
                        radial-gradient(at 0% 100%, #111316 0%, transparent 70%);
            filter: blur(80px);
            opacity: 0.4;
        }
        .glass-panel {
            background: rgba(30, 32, 35, 0.7);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(228, 190, 186, 0.1);
        }
    </style>
</head>
<body class="bg-surface font-body text-on-surface min-h-screen flex items-center justify-center overflow-x-hidden selection:bg-primary-container selection:text-white">
<!-- Background Atmospheric Depth -->
<div class="fixed inset-0 z-0 pointer-events-none">
<div class="absolute inset-0 mesh-gradient"></div>
<div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')] opacity-[0.03] mix-blend-overlay"></div>
</div>
<!-- Registration Container -->
<main class="relative z-10 w-full max-w-[480px] px-6 py-12 flex flex-col items-center">
<div class="w-full">
<!-- Branding Section -->
<div class="mb-10 text-left">
<div class="flex items-center gap-3 mb-4">
<div class="w-10 h-10 bg-primary-container flex items-center justify-center rounded-lg shadow-lg shadow-primary-container/20">
<span class="material-symbols-outlined text-white text-2xl" data-icon="shield">shield</span>
</div>
<h1 class="font-headline font-bold text-3xl tracking-tighter uppercase text-on-surface">
                    AXON <span class="text-primary-container">FIRE</span>
</h1>
</div>
<p class="text-on-surface-variant font-headline text-sm tracking-widest uppercase opacity-80">
                Tactical Command Interface v4.0
            </p>
</div>
<!-- Registration Card -->
<div class="glass-panel p-8 rounded-xl shadow-2xl relative overflow-hidden">
<!-- Decorative Scanner Line -->
<div class="absolute top-0 left-0 w-full h-[2px] bg-gradient-to-r from-transparent via-primary-container to-transparent opacity-50"></div>
<form action="#" class="space-y-5" method="POST">
<!-- Name Row -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div class="space-y-2">
<label class="block text-[10px] font-bold uppercase tracking-[0.2em] text-on-surface-variant ml-1" for="first_name">Nombre</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant text-lg group-focus-within:text-primary" data-icon="person">person</span>
</div>
<input class="block w-full pl-12 pr-4 py-3.5 bg-surface-container-highest/40 border-none rounded-lg focus:ring-1 focus:ring-primary-container/50 text-on-surface placeholder:text-on-surface-variant/30 text-sm transition-all" id="first_name" placeholder="Tu nombre" type="text"/>
</div>
</div>
<div class="space-y-2">
<label class="block text-[10px] font-bold uppercase tracking-[0.2em] text-on-surface-variant ml-1" for="last_name">Apellido</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant text-lg group-focus-within:text-primary" data-icon="badge">badge</span>
</div>
<input class="block w-full pl-12 pr-4 py-3.5 bg-surface-container-highest/40 border-none rounded-lg focus:ring-1 focus:ring-primary-container/50 text-on-surface placeholder:text-on-surface-variant/30 text-sm transition-all" id="last_name" placeholder="Tu apellido" type="text"/>
</div>
</div>
</div>
<!-- Email -->
<div class="space-y-2">
<label class="block text-[10px] font-bold uppercase tracking-[0.2em] text-on-surface-variant ml-1" for="email">Correo Electrónico</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant text-lg group-focus-within:text-primary" data-icon="alternate_email">alternate_email</span>
</div>
<input class="block w-full pl-12 pr-4 py-3.5 bg-surface-container-highest/40 border-none rounded-lg focus:ring-1 focus:ring-primary-container/50 text-on-surface placeholder:text-on-surface-variant/30 text-sm transition-all" id="email" placeholder="usuario@axonfire.com" type="email"/>
</div>
</div>
<!-- Phone -->
<div class="space-y-2">
<label class="block text-[10px] font-bold uppercase tracking-[0.2em] text-on-surface-variant ml-1" for="phone">Teléfono</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant text-lg group-focus-within:text-primary" data-icon="call">call</span>
</div>
<input class="block w-full pl-12 pr-4 py-3.5 bg-surface-container-highest/40 border-none rounded-lg focus:ring-1 focus:ring-primary-container/50 text-on-surface placeholder:text-on-surface-variant/30 text-sm transition-all" id="phone" placeholder="+34 000 000 000" type="tel"/>
</div>
</div>
<!-- Password -->
<div class="space-y-2">
<label class="block text-[10px] font-bold uppercase tracking-[0.2em] text-on-surface-variant ml-1" for="password">Contraseña</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant text-lg group-focus-within:text-primary" data-icon="lock">lock</span>
</div>
<input class="block w-full pl-12 pr-12 py-3.5 bg-surface-container-highest/40 border-none rounded-lg focus:ring-1 focus:ring-primary-container/50 text-on-surface placeholder:text-on-surface-variant/30 text-sm transition-all" id="password" placeholder="••••••••••••" type="password"/>
<button class="absolute inset-y-0 right-0 pr-4 flex items-center text-on-surface-variant hover:text-white transition-colors" type="button">
<span class="material-symbols-outlined text-lg" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Submit Action -->
<div class="pt-2">
<button class="w-full bg-primary-container hover:bg-primary-container/90 text-on-primary-container font-headline font-bold uppercase tracking-widest py-4 px-6 rounded-lg shadow-lg shadow-primary-container/20 active:scale-[0.98] transition-all flex items-center justify-center gap-3" type="submit">
<span>REGISTRARSE</span>
<span class="material-symbols-outlined text-xl" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</form>
<!-- Metadata/Security Note -->
<div class="mt-8 pt-6 border-t border-white/5 flex items-start gap-3">
<span class="material-symbols-outlined text-secondary text-base mt-0.5" data-icon="verified_user">verified_user</span>
<p class="text-[11px] text-on-surface-variant/60 leading-relaxed font-medium">
                    Central command registration requires verified biometric data for level 3 clearance. System monitoring enabled.
                </p>
</div>
</div>
<!-- Footer Links -->
<div class="mt-8 flex flex-col items-center gap-4">
<a class="group flex items-center gap-2 text-xs font-bold uppercase tracking-[0.15em] text-on-surface-variant hover:text-white transition-all" href="#">
<span>¿Ya tienes cuenta? <span class="text-primary-container ml-1">Inicia sesión aquí</span></span>
<span class="material-symbols-outlined text-sm group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</a>
<div class="flex gap-6 opacity-40">
<span class="text-[10px] font-bold uppercase tracking-widest cursor-default">Status: Secure</span>
<span class="text-[10px] font-bold uppercase tracking-widest cursor-default">Node: HK-09</span>
</div>
</div>
</div>
</main>
<!-- Global Layout Noise Overlay -->
<div class="fixed inset-0 pointer-events-none opacity-[0.02] bg-repeat z-[100]" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDkZa2NA261SyrMDlM-_87tjfT2twBbGTshyBd9T06t8-Yha5O6X1hdb5a7I0SyaRqRlMcJtfvqADC5HVduF7S30CypsrWYVzGabtD1UT3cZPQjdI-ezGdVYcsEsZIYZ4XDcPEu5UKjq_KUlnOoCFGiLZr2bY7rM-mNm3Nh-k-ighAZKW7qk-LNl1WpngEhICUo48cHcHdFg_nI8XDfSpIjNIYrXgpmixLrO6I_rYEqhX1G4q0gdUZG6J1vhsTSzje1KpJReGoFnS0Y');">
</div>
</body></html>
